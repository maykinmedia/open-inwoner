{% load i18n tz list_tags icon_tags grid_tags utils %}
{% if appointments %}
    {% url "profile:appointments" as appointment_list_url %}
    <oip-home-plugin-section title="{{ instance.title }}" next-url="{{ appointment_list_url }}" next-url-label="{% trans "Bekijk alle afspraken" %}" columns="2">
    {% for appointment in appointments %}
        {% timezone appointment.branch.timeZone %}
        <oip-home-plugin-card title="{{ appointment.title }}" detail-url="{{ appointment_list_url }}" date="{{ appointment.start|date:"j F Y" }} {% trans "om" %} {{ appointment.start|date:"H:i" }}" status="{{ appointment.services.0.name|default:appointment.title }}" address="{{ appointment.branch.addressLine2 }}, {{ appointment.branch.addressCity }}" identificatie="{{ appointment.publicId }}">
        </oip-home-plugin-card>
    {% endtimezone %}
{% endfor %}
</oip-home-plugin-section>
{% endif %}
