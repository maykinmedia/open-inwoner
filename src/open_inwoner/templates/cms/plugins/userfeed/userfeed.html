{% load i18n icon_tags button_tags %}

{% if userfeed %}
<section class="plugin userfeed">
    <header class="userfeed__header">
        <div class="heading-2__indicator">
            <h2 class="nl-heading nl-heading--level-2 {% if userfeed.action_required %}indicator{% endif %}">
                {{ instance.title }}
            </h2>
            {% if userfeed.action_required %}{% icon icon="fiber_manual_record" outlined=False extra_classes="file__file--recent" %}{% endif %}
        </div>
    </header>

    <div class="card-container card-container--columns-1 plugin-card">
        {{userfeed_item_list_json|json_script:"userfeed_data"}}
        <action-list actions-id="userfeed_data" />
    </div>
</section>
{% endif %}
