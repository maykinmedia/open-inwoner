{% load i18n icon_tags button_tags django_htmx %}
{% if show_zaken_plugin %}
    {% if request.htmx %}
        <oip-home-plugin-section title="{{ plugin_title }}" next-url="{{ mijn_zaken_url }}" show-indicator="false" next-url-label="{% trans "Bekijk alle zaken" %}" columns="2">
        {% if error_message %}<div slot="error">{{ error_message }}</div>{% endif %}
        {% for zaak in zaken %}
            <oip-home-plugin-card title="{{ zaak.title }}" description="{{ zaak.detail_label }}" identificatie="{{ zaak.identification }}" detail-url="{{ zaak.url }}">
            </oip-home-plugin-card>
        {% endfor %}
        </oip-home-plugin-section>
    {% else %}
        <div id="zaken-live-region"
             class="sr-only"
             role="status"
             aria-live="polite"
             aria-atomic="true"></div>
        <div id="zaken-htmx-container">
            <oip-home-plugin-section title="{{ plugin_title }}" next-url="{{ mijn_zaken_url }}" show-indicator="false" next-url-label="{% trans "Bekijk alle zaken" %}" columns="1">
            <oip-loading-spinner loading-text="{% trans "Zaken laden..." %}" loaded-text="{% trans "Zaken zijn geladen." %}" hx-get="{{ hx_get_url }}" hx-trigger="load" hx-target="#zaken-htmx-container" hx-swap="outerHTML" compact="true" data-spinner-for="zaken-htmx-container" data-spinner-live-region="zaken-live-region">
            </oip-loading-spinner>
            </oip-home-plugin-section>
        </div>
    {% endif %}
{% endif %}
