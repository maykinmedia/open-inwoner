{% load i18n icon_tags button_tags django_htmx %}
<!-- start zaken plugin -->
{% if show_zaken_plugin %}
    {% if request.htmx %}
        <oip-zaken-plugin-container>
            {% if error_message %}<div slot="error">{{ error_message }}</div> {% endif %}
            {% for zaak in zaken %}
                <oip-zaken-plugin-zaak-item
                    description="{{ zaak.description }}"
                    identificatie="{{ zaak.identification }}"
                    detail-url="{{ zaak.url }}"
                    >
                    <div slot="continue-section"></div>
                </oip-zaken-plugin-zaak-item>
            {% endfor %}
        </oip-zaken-plugin-container>
    {% else %}
        <oip-homepage-plugin-section
            title="{{ plugin_title }}"
            next-url="{{ mijn_zaken_url }}"
            next-url-label="Bekijk alle zaken">
                <div hx-get="{{ hx_get_url }}">
                    <div>Laden...</div>
                </div>
        </oip-homepage-plugin-section>
    {% endif %}
{% endif %}
<!-- end zaken plugin -->
