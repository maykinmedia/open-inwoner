{% load i18n icon_tags button_tags django_htmx %}

{% if show_zaken_plugin %}
    {% if request.htmx %}
        <oip-home-plugin-section
            title="{{ plugin_title }}"
            next-url="{{ mijn_zaken_url }}"
            show-indicator="false"
            next-url-label="{% trans 'Bekijk alle zaken' %}"
            columns="2"
        >
            {% if error_message %}<div slot="error">{{ error_message }}</div> {% endif %}
            {% for zaak in zaken %}
                <oip-home-plugin-card
                    title="{{ zaak.description }}"
                    description="{% if zaak.identification %}{% trans "Zaaknummer: " %}{{zaak.identification}}{% endif %}"
                    identificatie="{{ zaak.identification }}"
                    detail-url="{{ zaak.url }}"
                    >
                </oip-home-plugin-card>
            {% endfor %}
        </oip-home-plugin-section>
    {% else %}
        <div
            hx-get="{{ hx_get_url }}"
            hx-trigger="load"
            hx-swap="outerHTML">
            <oip-home-plugin-section
                title="{{ plugin_title }}"
                next-url="{{ mijn_zaken_url }}"
                show-indicator="false"
                next-url-label="{% trans 'Bekijk alle zaken' %}"
                columns="1"
            >
                <oip-loading-spinner loading-text="{% trans 'Zaken laden...' %}"></oip-loading-spinner>
            </oip-home-plugin-section>
        </div>
    {% endif %}
{% endif %}
