{% load static i18n sekizai_tags cms_tags %}
<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        {% render_block "css" %}
    </head>
    <body>
        {% cms_toolbar %}
        {% block breadcrumb %}
        {% endblock breadcrumb %}
        {% block content %}
        {% endblock content %}
        {% block footer %}
        {% endblock footer %}
        {% render_block "js" %}
    </body>
</html>
