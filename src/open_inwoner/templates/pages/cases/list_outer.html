{% extends "master.html" %}
{% load i18n static %}
{% block notifications %}
    <div id="spinner-live-region"
         class="sr-only"
         role="status"
         aria-live="polite"
         aria-atomic="true"></div>
{% endblock notifications %}
{% block sidebar_content %}
    {% include "components/Sidenav/Sidenav.html" %}
{% endblock sidebar_content %}
{% block content %}
    <div class="cases"
         id="any-error"
         data-error-message="{% trans "We konden geen zaken ophalen. Probeer het later opnieuw." %}"></div>
    <div class="cases" id="cases-content"></div>
    <oip-loading-spinner
    id="spinner-container"
    {# indicator that this spinner hides instead of unmounting #}
    data-spinner-for="cases-content"
    data-spinner-live-region="spinner-live-region"
    loading-text="{% trans "Gegevens laden..." %}"
    loaded-text="{% trans "Gegevens zijn geladen." %}"
    hx-get="{{ hxget }}"
    hx-trigger="load"
    hx-target="#cases-content"
    hx-target-error="#any-error">
    </oip-loading-spinner>
{% endblock content %}
