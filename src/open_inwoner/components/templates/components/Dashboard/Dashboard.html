{% load i18n icon_tags %}

<aside class="dashboard" aria-label="{% trans "Dashboard" %}">
    <ul class="dashboard__list">
        {% for metric in metrics %}
            <li class="dashboard__list-item">
                <nl-paragraph><span class="dashboard__item-label">{{ metric.label }}:</span> {{ metric.value|default:'-' }}</nl-paragraph>
            </li>
        {% endfor %}
    </ul>
</aside>
