{% load form_tags %}

<div class="form__control">
    <label class="label">
        {% firstof field.label label %}
        {{ field|addclass:"textarea" }}
        {% if field.help_text %}
            <nl-paragraph>{{ field.help_text }}</nl-paragraph>
        {% endif %}

        {% if field.errors %}
            {% errors errors=field.errors %}
        {% endif %}
    </label>
</div>
