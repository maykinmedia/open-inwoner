#
# Docker-compose for full Open Inwoner stack.
#
# DISCLAIMER: THIS IS FOR DEVELOPMENT PURPOSES ONLY AND NOT SUITABLE FOR PRODUCTION.
#
# You can use this docker-compose to spin up a local Open Inwoner stack for demo/try-out
# purposes, or to get some insight in the various components involved (e.g. to build
# your Helm charts from). Note that various environment variables are UNSAFE and merely
# specified so that you can get up and running with the least amount of friction.
#
# Before deploying to production, please review the environment configuration reference:
# https://open-inwoner.readthedocs.io/
#

x-app-env: &x-app-env
  LOG_STDOUT: 'true'
  DJANGO_SETTINGS_MODULE: open_inwoner.conf.docker
  SECRET_KEY: ${SECRET_KEY:-7bk)w=_%lnm#68rc!c)h@gy&5+%^fl=okq17bv!)yv!l0udu2y}
  ALLOWED_HOSTS: '*'
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
  CSRF_TRUSTED_ORIGINS: "'http://localhost:9000'"
  CACHE_DEFAULT: redis:6379/0
  CACHE_AXES: redis:6379/0
  CACHE_OIDC: redis:6379/0
  CACHE_PORTALOCKER: redis:6379/0
  # Consumed by the `celery-low-latency` service below; see docs/installation/celery.rst
  CACHE_SEEDING_QUEUE: low-latency
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_LOGLEVEL: DEBUG
  ES_HOST: http://elasticsearch:9200
  ES_USERNAME: ${ES_USERNAME:-elastic}
  ES_PASSWORD: ${ES_PASSWORD:-elastic}
  OIDC_FRONTEND_LOGOUT_WITH_HINTS: 'true'
  # Routed to the `mailpit` service below; view sent mail at http://localhost:8025/
  EMAIL_HOST: mailpit
  EMAIL_PORT: '1025'
  EMAIL_USE_TLS: 'False'
  # Needed for Celery Flower to match the TIME_ZONE configured in the
  # settings used by workers and beat containers.
  TZ: Europe/Amsterdam
  # WARNING: Strictly for development!
  DISABLE_2FA: ${DISABLE_2FA:-True}
  DEBUG: 'True'
  IS_HTTPS: 'no'
  ALLOW_CUSTOM_JS: 'False'
  # Overridable uwsgi settings
  UWSGI_PROCESSES:
  UWSGI_THREADS:
  PORT:
  UWSGI_HTTP_KEEPALIVE:
  UWSGI_HTTP_TIMEOUT:
  UWSGI_HARAKIRI:
  UWSGI_MAX_REQUESTS:
  UWSGI_POST_BUFFERING:
  UWSGI_BUFFER_SIZE:
  # Overridable ZGW API settings
  ZGW_MAX_REQUESTS:
  STATIC_ROOT_VOLUME: /srv/static
  # Enabling Open Telemetry requires the services in docker/docker-compose.observability.yml
  # to be up and running.
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: oip.target=docker-compose
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
  # Not host-overridable via ${...:-}: "otel-collector" is this compose
  # network's own internal DNS name for the sibling container started by
  # docker/docker-compose.observability.yml. A stray OTEL_EXPORTER_OTLP_ENDPOINT
  # already set in the invoking shell (e.g. from local non-Docker OTel
  # testing) would otherwise silently win over this default, since Compose
  # resolves ${VAR:-default} against its own invocation environment first --
  # pointing every container at some unrelated/nonexistent endpoint instead.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317 # gRPC
  # otel:supersecret, escape spaces and = with percent encoding
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic b3RlbDpzdXBlcnNlY3JldA==
  OTEL_EXPORTER_OTLP_METRICS_INSECURE: ${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
  _OTEL_ENABLE_CONTAINER_RESOURCE_DETECTOR: 'true'

services:
  db:
    image: postgis/postgis:${PG_VERSION:-14-master}
    container_name: open-inwoner-db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - POSTGRES_DB=${POSTGRES_DB:-open_inwoner}
      - POSTGRES_USER=${POSTGRES_USER:-open_inwoner}
    volumes:
      - ./docker-initdb.d/:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data
    networks:
      - open-inwoner-dev

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      # The built-in superuser is always named 'elastic'; only the password is
      # configurable here. If you set ES_USERNAME to a custom user on the app
      # side, you must create that user in Elasticsearch manually.
      - ELASTIC_PASSWORD=${ES_PASSWORD:-elastic}
      - xpack.security.enabled=true
    networks:
      - open-inwoner-dev
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORTS:-9201:9201}

  redis:
    image: redis:6
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - open-inwoner-dev
    volumes:
      - data:/data

  mailpit:
    image: axllent/mailpit
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      # Local dev only: accept any (or no) SMTP credentials so app-side
      # EMAIL_HOST_USER/EMAIL_HOST_PASSWORD can stay unset.
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025 # web UI
      - 1025:1025 # SMTP
    networks:
      - open-inwoner-dev

  prepare-volumes:
    image: busybox
    command:
      /bin/chown -R 1000 /private-media /srv/static /setup-configuration-state
    volumes:
      - private_media:/private-media
      - static:/srv/static
      - setup_configuration_state:/setup-configuration-state

  web: &web-service
    build: &web_build
      context: .
      args:
        RELEASE: ${TAG:-latest}
        COMMIT_HASH: ${COMMIT_HASH:-}
    container_name: open-inwoner-web
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests;
          exit(requests.head('http://localhost:8000/admin/').status_code not in
          [200, 302])",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # This should allow for enough time for migrations to run before the max
      # retries have passed. This healthcheck in turn allows other containers
      # to wait for the database migrations.
      start_period: 60s
    volumes: &web_volumes
      - media:/app/media
      - private_media:/app/private_media
      - static:/srv/static
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      prepare-volumes:
        condition: service_completed_successfully
      web-init:
        condition: service_completed_successfully
    networks:
      - open-inwoner-dev

  web-init:
    <<: *web-service
    container_name: open-inwoner-web-init
    ports: []
    command: /setup_configuration.sh
    # the inherited healthcheck probes the webserver, which this one-shot
    # container never starts
    healthcheck:
      disable: true
    volumes:
      - ./docker/setup_configuration:/app/setup_configuration
      # Marker directory `/setup_configuration.sh` uses to only run
      # `setup_configuration` once per database, instead of on every
      # `docker compose up`/restart -- see that script for why.
      - setup_configuration_state:/var/lib/open-inwoner/setup-configuration
    # Override depends_on to prevent a circular dependency: web-init inherits
    # *web-service which would otherwise include web-init itself.
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      prepare-volumes:
        condition: service_completed_successfully

  nginx:
    image: nginx
    volumes:
      - ./docker-nginx-default.conf:/etc/nginx/conf.d/default.conf
      - private_media:/private-media
      - static:/srv/static
    ports:
      - '9000:80'
    depends_on:
      - web
    networks:
      - open-inwoner-dev

  celery:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_worker.sh
    healthcheck:
      test: ['CMD', 'maykin-common', 'worker-health-check', '--skip-ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes: *web_volumes
    depends_on:
      web-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - open-inwoner-dev

  celery-low-latency:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment:
      <<: *x-app-env
      CELERY_WORKER_QUEUE: ${CELERY_WORKER_QUEUE:-low-latency}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-10}
    command: /celery_worker.sh
    healthcheck:
      test: ['CMD', 'maykin-common', 'worker-health-check', '--skip-ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes: *web_volumes
    depends_on:
      web-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - open-inwoner-dev

  celery-beat:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_beat.sh
    healthcheck:
      test:
        - CMD
        - maykin-common
        - beat-health-check
        - --max-age
        - '1200'
      interval: 300s
      timeout: 5s
      retries: 3
      # The liveness file is written only when beat publishes a task. The most
      # frequent static task fires every 15 minutes, so allow that full window
      # before health check failures start counting against the container.
      start_period: 900s
    depends_on:
      - celery
    networks:
      - open-inwoner-dev

  celery-monitor:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_monitor.sh
    depends_on:
      - celery
    networks:
      - open-inwoner-dev

  clamav:
    image: clamav/clamav:stable
    container_name: open-inwoner-clamav
    # ClamAV exposes its TCP socket on port 3310
    ports:
      - '3310:3310'
    networks:
      - open-inwoner-dev
    # The daemon needs a writable directory to store virus definitions
    volumes:
      - clamav_data:/var/lib/clamav

  frontend-test:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /work
    environment:
      - CI=true
    volumes:
      - .:/work
      - frontend_node_modules:/work/node_modules
    command: npm run test
    profiles:
      - frontend-test

volumes:
  db:
  media:
  private_media:
  static:
  data:
  es_data:
  frontend_node_modules:
  clamav_data:
  setup_configuration_state:
  mailpit_data:

networks:
  # Created once via `bin/ensure_dev_network.sh`, not by this (or any other)
  # compose file: every compose file under docker/ (open-zaak, objects-apis,
  # hc-brp-mock, openklant, keycloak, observability) that also joins this
  # network attaches via `external: true` too. With several files declaring
  # the same network, whichever one gets merged last would otherwise decide
  # whether Compose tries to (re)create it -- which previously caused
  # "network ... not found" races when combining multiple `-f`/`include:`
  # files. A single external network sidesteps that entirely. Run
  # `bin/ensure_dev_network.sh` before bringing up any stack for the first
  # time, or just use `bin/stack.sh up`. See docs/installation/docker-compose.rst.
  open-inwoner-dev:
    external: true
