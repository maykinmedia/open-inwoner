#
# Docker-compose for full Open Inwoner stack.
#
# DISCLAIMER: THIS IS FOR DEVELOPMENT PURPOSES ONLY AND NOT SUITABLE FOR PRODUCTION.
#
# You can use this docker-compose to spin up a local Open Inwoner stack for demo/try-out
# purposes, or to get some insight in the various components involved (e.g. to build
# your Helm charts from). Note that various environment variables are UNSAFE and merely
# specified so that you can get up and running with the least amount of friction.
#
# Before deploying to production, please review the environment configuration reference:
# https://open-inwoner.readthedocs.io/
#
version: '3.4'

x-app-env: &x-app-env
  LOG_STDOUT: 'true'
  DJANGO_SETTINGS_MODULE: open_inwoner.conf.docker
  SECRET_KEY: ${SECRET_KEY:-7bk)w=_%lnm#68rc!c)h@gy&5+%^fl=okq17bv!)yv!l0udu2y}
  ALLOWED_HOSTS: '*'
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
  CSRF_TRUSTED_ORIGINS: "'http://localhost:9000'"
  CACHE_DEFAULT: redis:6379/0
  CACHE_AXES: redis:6379/0
  CACHE_OIDC: redis:6379/0
  CACHE_PORTALOCKER: redis:6379/0
  CACHE_SEEDING_QUEUE: low-latency
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_LOGLEVEL: DEBUG
  ES_HOST: http://elasticsearch:9200
  ES_USERNAME: ${ES_USERNAME:-elastic}
  ES_PASSWORD: ${ES_PASSWORD:-elastic}
  OIDC_FRONTEND_LOGOUT_WITH_HINTS: 'true'
  # Needed for Celery Flower to match the TIME_ZONE configured in the
  # settings used by workers and beat containers.
  TZ: Europe/Amsterdam
  # WARNING: Strictly for development!
  DISABLE_2FA: ${DISABLE_2FA:-True}
  DEBUG: 'True'
  IS_HTTPS: 'no'
  ALLOW_CUSTOM_JS: 'False'
  # Overridable uwsgi settings
  UWSGI_PROCESSES:
  UWSGI_THREADS:
  PORT:
  UWSGI_HTTP_KEEPALIVE:
  UWSGI_HTTP_TIMEOUT:
  UWSGI_HARAKIRI:
  UWSGI_MAX_REQUESTS:
  UWSGI_POST_BUFFERING:
  UWSGI_BUFFER_SIZE:
  # Overridable ZGW API settings
  ZGW_MAX_REQUESTS:
  STATIC_ROOT_VOLUME: /srv/static
  # Enabling Open Telemetry requires the services in docker/docker-compose.observability.yml
  # to be up and running.
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: oip.target=docker-compose
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317} # gRPC
  # otel:supersecret, escape spaces and = with percent encoding
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic b3RlbDpzdXBlcnNlY3JldA==
  OTEL_EXPORTER_OTLP_METRICS_INSECURE: ${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
  _OTEL_ENABLE_CONTAINER_RESOURCE_DETECTOR: 'true'

services:
  db:
    image: postgis/postgis:${PG_VERSION:-14-master}
    container_name: open-inwoner-db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - POSTGRES_DB=${POSTGRES_DB:-open_inwoner}
      - POSTGRES_USER=${POSTGRES_USER:-open_inwoner}
    volumes:
      - ./docker-initdb.d/:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data
    networks:
      - openinwoner-dev

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      # The built-in superuser is always named 'elastic'; only the password is
      # configurable here. If you set ES_USERNAME to a custom user on the app
      # side, you must create that user in Elasticsearch manually.
      - ELASTIC_PASSWORD=${ES_PASSWORD:-elastic}
      - xpack.security.enabled=true
    networks:
      - openinwoner-dev
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORTS:-9201:9201}

  redis:
    image: redis:6
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - openinwoner-dev
    volumes:
      - data:/data

  prepare-volumes:
    image: busybox
    command: /bin/chown -R 1000 /private-media /srv/static
    volumes:
      - private_media:/private-media
      - static:/srv/static

  web: &web-service
    build: &web_build
      context: .
      args:
        RELEASE: ${TAG:-latest}
    container_name: open-inwoner-web
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests;
          exit(requests.head('http://localhost:8000/admin/').status_code not in
          [200, 302])",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # This should allow for enough time for migrations to run before the max
      # retries have passed. This healthcheck in turn allows other containers
      # to wait for the database migrations.
      start_period: 60s
    volumes: &web_volumes
      - media:/app/media
      - private_media:/app/private_media
      - static:/srv/static
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis
      - prepare-volumes
    networks:
      - openinwoner-dev

  web-init:
    <<: *web-service
    container_name: open-inwoner-web-init
    ports: []
    command: /setup_configuration.sh
    volumes:
      - ./docker/setup_configuration:/app/setup_configuration

  nginx:
    image: nginx
    volumes:
      - ./docker-nginx-default.conf:/etc/nginx/conf.d/default.conf
      - private_media:/private-media
      - static:/srv/static
    ports:
      - '9000:80'
    depends_on:
      - web
    networks:
      - openinwoner-dev

  celery:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_worker.sh
    healthcheck:
      test: ['CMD', 'python', '/app/bin/check_celery_worker_liveness.py']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: *web_volumes
    depends_on:
      web:
        # This health check condition is needed because Celery Beat will
        # try to convert the CELERY_BEAT_SCHEDULE into database entries. For
        # this, migrations need to be finished. If Celery tasks were still
        # pending, the database also needs to be ready for Celery itself. We
        # therefore have the health check here, and make Celery beat and
        # monitor containers depend on the celery container.
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - openinwoner-dev

  celery-low-latency:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment:
      <<: *x-app-env
      CELERY_WORKER_QUEUE: ${CELERY_WORKER_QUEUE:-low-latency}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-10}
    command: /celery_worker.sh
    healthcheck:
      test: ['CMD', 'python', '/app/bin/check_celery_worker_liveness.py']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: *web_volumes
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - openinwoner-dev

  celery-beat:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_beat.sh
    depends_on:
      - celery
    networks:
      - openinwoner-dev

  celery-monitor:
    build: *web_build
    image: maykinmedia/open-inwoner:${TAG:-latest}
    environment: *x-app-env
    command: /celery_monitor.sh
    depends_on:
      - celery
    networks:
      - openinwoner-dev

  clamav:
    image: clamav/clamav:stable
    container_name: open-inwoner-clamav
    # ClamAV exposes its TCP socket on port 3310
    ports:
      - '3310:3310'
    networks:
      - openinwoner-dev
    # The daemon needs a writable directory to store virus definitions
    volumes:
      - clamav_data:/var/lib/clamav

  frontend-test:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /work
    environment:
      - CI=true
    volumes:
      - .:/work
      - frontend_node_modules:/work/node_modules
    command: npm run test
    profiles:
      - frontend-test

volumes:
  db:
  media:
  private_media:
  static:
  data:
  es_data:
  frontend_node_modules:
  clamav_data:

networks:
  openinwoner-dev:
    name: openinwoner-dev
