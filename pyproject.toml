[project]
name = "open-inwoner"
version = "2.4.3"
requires-python = "~= 3.13"

[tool.uv.pip]
# Note: setuptools is NOT excluded because it must be explicitly installed
# to ensure pkg_resources is available for legacy dependencies (django-axes,
# django-formtools). See requirements/base.in for setuptools<81 pin.
no-emit-package = [
  "pip",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "env",

    # Django specific
    "static",
    "media",
    "env",

    # Project specific
    "src/maykin_config_checks",
    "src/open_inwoner/conf/local.py",
    "performance-tests",
    "bootstrap.py",
    "bin",
    "docs"
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#error-e
    "E",
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F",
    # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SIM",
    # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PERF",
    # https://docs.astral.sh/ruff/rules/#refurb-furb
    "FURB",
    # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "B006",
    "B010",
    "B904",
    # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "N",
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I",
    # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
    "S",
    # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "T20",
    # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "TID",
]
ignore = [
    # Whitespace before ':' (conflicts with Black)
    "E203",
    # Two spaces before inline comment
    "E261",
    # Line too long
    "E501",
    # Do not assign a lambda expression
    "E731",
    # Name may be undefined from '*' import
    "F405",
    # Local variable is assigned but never used
    "F841",
    # Ambiguous variable name
    "E741",
    # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "SIM117",
    # Checks for nested if statements that can be collapsed into a single if statement.
    "SIM102",
    # Variables in function scope should be lower-case
    "N806",
    # Variables in class scope should not be mixed-case
    "N815",
    # Exception name should be named with Error suffix
    "N818",
    # Checks for uses of the Python requests or httpx module that omit the timeout parameter.
    "S113"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ad hoc exceptions
[tool.ruff.lint.pep8-naming]
ignore-names = [
    # N801
    "eHerkenning*",
    "eSuite*",
    # N802
    "*setUp*",
    "tearDown*",
    "*assert*",
    "*TimelineLog*",
    "innNnpId",
]

[tool.ruff.lint.per-file-ignores]
# Ignore security rules in test files
"**/test_*.py" = ["S"]
"**/tests/**/*.py" = ["S"]
# MultiZgwClientProxy may only be used in its own module and in its dedicated tests
"src/open_inwoner/openzaak/clients.py" = ["TID251"]
"src/open_inwoner/openzaak/exceptions.py" = ["TID251"]
"src/open_inwoner/openzaak/services.py" = ["TID251"]
"src/open_inwoner/openzaak/tests/test_clients.py" = ["TID251"]

# Import sorting configuration (equivalent to isort)
[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = false
known-first-party = ["open_inwoner", "maykin_config_checks"]
lines-after-imports = -1
relative-imports-order = "furthest-to-closest"
sections = { django = ["django"] }
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow relative imports from parents, but allow from siblings
ban-relative-imports = "parents"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use `structlog.get_logger(__name__)` instead of the stdlib logging module."
"open_inwoner.openzaak.clients.MultiZgwClientProxy".msg = "Use ZGWService instead of MultiZgwClientProxy directly."

[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true
allow_abort = true
allowed_prefixes = []
pre_bump_hooks = [
    "sed -i \"s/releaseDate: '.*'/releaseDate: '$(date +%Y-%m-%d)'/\" publiccode.yaml",
    "uv lock",
    "pre-commit run --files pyproject.toml README.rst publiccode.yaml src/open_inwoner/conf/base.py $CZ_PRE_CHANGELOG_FILE_NAME uv.lock || true",
    "git add -u",
]
version_files = [
    "README.rst::Version: ",
    "publiccode.yaml:softwareVersion: ",
    'src/open_inwoner/conf/base.py:RELEASE = "v',
]

[tool.commitizen.customize]
commit_parser = "^(?P<change_type>feat|fix|docs|style|refactor|test|build|ci|chore|revert)(?:\\((?P<scope>[^)]+)\\))?!?:\\s(?P<message>.+)"
changelog_pattern = "^(feat|fix|docs|style|refactor|test|build|ci|chore|revert)(\\(.+\\))?(!)?:"
schema_pattern = "^(feat|fix|docs|style|refactor|test|build|ci|chore|revert)(\\([a-z0-9_-]+\\))?!?:\\s(\\[#\\d+\\]\\s)?.+"
message_template = "{{change_type}}:{% if issue %} [#{{ issue }}]{% endif %} {{subject}}{% if body %}\n\n{{body}}{% endif %}{% if footer %}\n\n{{footer}}{% endif %}"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing"
choices = [
    {value = "feat", name = "feat: A new feature. Correlates with MINOR in SemVer"},
    {value = "fix", name = "fix: A bug fix. Correlates with PATCH in SemVer"},
    {value = "docs", name = "docs: Documentation only changes"},
    {value = "style", name = "style: Changes that do not affect the meaning of the code"},
    {value = "refactor", name = "refactor: A code change that neither fixes a bug nor adds a feature"},
    {value = "test", name = "test: Adding missing tests or correcting existing tests"},
    {value = "build", name = "build: Changes that affect the build system or external dependencies"},
    {value = "ci", name = "ci: Changes to CI configuration files and scripts"},
    {value = "chore", name = "chore: Other changes that don't modify src or test files"},
    {value = "revert", name = "revert: Reverts a previous commit"},
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "issue"
message = "Provide the issue number: (press [enter] to skip)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "subject"
message = "Write a short and imperative summary of the code changes: (lower case and no period)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Provide additional contextual information about the code changes: (press [enter] to skip)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "footer"
message = "Information about Breaking Changes and reference issues that this commit closes: (press [enter] to skip)"
