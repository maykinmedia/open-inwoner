---
# Taken and adapted from https://grafana.com/docs/loki/latest/setup/install/docker/#install-with-docker-compose

services:
  # logs storage
  loki:
    image: grafana/loki:latest
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./docker/observability/loki/local-config.yml:/etc/loki/local-config.yml
    networks:
      - open-inwoner-dev

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-tsdb:/prometheus
    networks:
      - open-inwoner-dev

  # log scraping from container output
  promtail:
    image: grafana/promtail:latest
    volumes:
      # for service discovery & reading container logs - note that doing this in
      # production is NOT recommended due to security concerns
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # custom config file to scrape container logs
      - ./docker/observability/promtail/config.yml:/etc/promtail/config.yml
      - promtail-logs:/var/log
    command: -config.file=/etc/promtail/config.yml
    networks:
      - open-inwoner-dev

  # one-shot: Tempo's container runs as uid 10001, so the bind-mounted
  # ./tempo-data needs to be chowned to it before Tempo itself starts
  tempo-init:
    image: busybox:latest
    user: root
    entrypoint:
      - 'chown'
      - '10001:10001'
      - '/var/tempo'
    volumes:
      - ./tempo-data:/var/tempo
    networks:
      - open-inwoner-dev

  # traces backend, queried by Grafana's Tempo datasource
  tempo:
    image: grafana/tempo:2.10.0
    command: --config.file=/etc/tempo.yml
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo.yml
      - ./tempo-data:/var/tempo
    ports:
      - '3200:3200'
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    networks:
      - open-inwoner-dev

  # open telemetry collector, receives metrics from the application instance(s)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: --config=/etc/otel-collector-config.yaml
    volumes:
      - ./docker/observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317
      - 4318:4318
      - 8889:8889
    networks:
      - open-inwoner-dev

  # dashboard tool, visualizes telemetry. queries loki and prometheus
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
    ports:
      - '3000:3000'
    networks:
      - open-inwoner-dev

volumes:
  promtail-logs:
  prometheus-tsdb:

networks:
  # Created once via `bin/ensure_dev_network.sh`, not by this (or any other)
  # compose file, so bringing up several stacks together never races over who
  # "owns" the network. See docs/installation/docker-compose.rst.
  open-inwoner-dev:
    external: true
