# Publishes the backing services a host-run OIP process needs, on top of the
# services already defined in docker-compose.yml. Opt-in: `bin/stack.sh up
# --localhost` adds this file to the compose chain; by hand, add
# `-f docker/docker-compose.hostdev.yml` to any invocation that already
# includes docker-compose.yml.
#
# Postgres, Redis and Elasticsearch use non-default host ports (5433, 6380,
# 9202) so they don't collide with a native install on 5432/6379/9200. See
# docs/installation/docker-compose.rst for the env vars this requires on the
# Django side.
services:
  db:
    ports:
      - 5433:5432

  redis:
    ports:
      - 6380:6379

  elasticsearch:
    ports:
      - 9202:9200

  # The Objects API validates its `type=` filter by an exact string match
  # against the `zgw_consumers.service.api_root` it has on file for the
  # objecttype's owning service (docker/objects-apis/fixtures/objects_api_fixtures.json,
  # correct for the "objecttypes.internal" alias a container-mode Open Inwoner
  # uses). A host-run Open Inwoner instead builds that filter from
  # http://localhost:8003/..., so the fixture loader also loads this file
  # (sorted after the base one -- see /start.sh's `for fixture in $(ls
  # fixtures_dir/*.json)`) to overwrite that one row with the localhost value.
  objects-web:
    volumes:
      - ./docker/objects-apis/fixtures/objects_api_fixtures.json:/app/fixtures/objects_api_fixtures.json
      - ./docker/objects-apis/fixtures/objects_api_fixtures.localhost.json:/app/fixtures/objects_api_fixtures.localhost.json
