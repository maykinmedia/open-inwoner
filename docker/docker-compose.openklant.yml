# Inspired by https://docs.docker.com/compose/django/

services:
  openklant-db:
    image: postgis/postgis:${PG_VERSION:-14-master}
    environment:
      - POSTGRES_USER=open_klant
      - POSTGRES_PASSWORD=open_klant
      - POSTGRES_DB=open_klant
    volumes:
      - openklant-db:/var/lib/postgresql/data
    healthcheck:
      # Not `-U postgres`: POSTGRES_USER above means that role is never
      # created here (unlike the other satellites' db services, which don't
      # override POSTGRES_USER and so keep the image's default "postgres"
      # superuser) -- `-U postgres` would have pg_isready fail every single
      # run with "FATAL: role "postgres" does not exist", spamming the logs
      # even though the server is otherwise perfectly healthy.
      test: ['CMD-SHELL', 'pg_isready -U open_klant']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      open-inwoner-dev:

  openklant-redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      open-inwoner-dev:

  openklant-web:
    image: maykinmedia/open-klant:${OPEN_KLANT_IMAGE_TAG:-2.15.0}
    environment: &openklant_web_env
      - DJANGO_SETTINGS_MODULE=openklant.conf.docker
      - SECRET_KEY=${SECRET_KEY:-a8s@b*ds4t84-q_2#c0j0506@!l2q6r5_pq5e!vm^_9c*#^66b}
      - DB_HOST=openklant-db
      - DB_NAME=open_klant
      - DB_USER=open_klant
      - DB_PASSWORD=open_klant
      - ALLOWED_HOSTS=*
      - CACHE_DEFAULT=openklant-redis:6379/0
      - CACHE_AXES=openklant-redis:6379/0
      - NOTIFICATIONS_DISABLED=1
      # Same OTel setup as the main app (docker-compose.yml's x-app-env) --
      # open-klant is built on the same `open_api_framework`/`maykin_common`
      # base, so it exports to the same collector. OTEL_SDK_DISABLED
      # defaults to true; bin/stack.sh up flips it for the whole stack.
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=openklant
      # Not host-overridable via ${...:-} -- see docker-compose.yml's
      # x-app-env for why.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic b3RlbDpzdXBlcnNlY3JldA==
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
      - OTEL_RESOURCE_ATTRIBUTES=oip.target=docker-compose
    ports:
      - 8338:8000
    depends_on:
      openklant-db:
        condition: service_healthy
      openklant-redis:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', "bash -c '</dev/tcp/localhost/8000' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      open-inwoner-dev:
        aliases:
          - openklant.local
          - openklant.internal

  openklant-seed:
    image: maykinmedia/open-klant:${OPEN_KLANT_IMAGE_TAG:-2.15.0}
    environment: *openklant_web_env
    command: python src/manage.py loaddata --ignorenonexistent /fixtures/db.json
    volumes:
      - ./docker/openklant/fixtures:/fixtures:ro
    depends_on:
      openklant-web:
        condition: service_healthy
    networks:
      open-inwoner-dev:
    restart: 'no'

networks:
  # Created once via `bin/ensure_dev_network.sh`, not by this (or any other)
  # compose file, so bringing up several stacks together never races over who
  # "owns" the network. See docs/installation/docker-compose.rst.
  open-inwoner-dev:
    external: true

volumes:
  openklant-db:
