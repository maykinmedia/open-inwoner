services:
  objects-redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      open-inwoner-dev:

  objects-db:
    image: postgis/postgis:${PG_VERSION:-14-master}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./docker/objects-apis/docker-init-objects-apis-db/:/docker-entrypoint-initdb.d
      - objects-apis-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      open-inwoner-dev:

  objecttypes-web:
    image: maykinmedia/objecttypes-api:${OBJECTTYPES_VERSION:-2.2.0}
    environment:
      - DJANGO_SETTINGS_MODULE=objecttypes.conf.docker
      - SECRET_KEY=${SECRET_KEY:-fgv=c0hz&tl*8*3m3893@m+1pstrvidc9e^5@fpspmg%cy$15d}
      - ALLOWED_HOSTS=*
      - DB_HOST=objects-db
      - DB_NAME=objecttypes
      - DB_USER=objecttypes
      - CACHE_DEFAULT=objects-redis:6379/1
      - CACHE_AXES=objects-redis:6379/1
      - OBJECTTYPE_SUPERUSER_USERNAME=admin
      - OBJECTTYPE_SUPERUSER_PASSWORD=admin
      - OBJECTTYPE_SUPERUSER_EMAIL=admin@localhost
      - DISABLE_2FA=true
      # Same OTel setup as the main app (docker-compose.yml's x-app-env) --
      # objecttypes-api is built on the same `open_api_framework`/
      # `maykin_common` base, so it exports to the same collector.
      # OTEL_SDK_DISABLED defaults to true; bin/stack.sh up flips it for the
      # whole stack.
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=objecttypes
      # Not host-overridable via ${...:-} -- see docker-compose.yml's
      # x-app-env for why.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic b3RlbDpzdXBlcnNlY3JldA==
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
      - OTEL_RESOURCE_ATTRIBUTES=oip.target=docker-compose
    ports:
      - 8003:8000
    volumes:
      - ./docker/objects-apis/fixtures/objecttypes_api_fixtures.json:/app/fixtures/objecttypes_api_fixtures.json
    # Same open_api_framework/maykin_common base as objects-web below (see
    # its healthcheck for why this is needed at all) -- objecttypes-api's
    # own docker-compose.yml doesn't define one, so this mirrors that
    # sibling instead of an upstream example.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests;
          exit(requests.head('http://localhost:8000/admin/').status_code not in
          [200, 302])",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      objects-db:
        condition: service_healthy
      objects-redis:
        condition: service_started
    networks:
      open-inwoner-dev:
        aliases:
          - objecttypes.local
          - objecttypes.internal

  objects-web:
    image: maykinmedia/objects-api:${OBJECTS_VERSION:-2.4.0}
    environment: &objects_web_env
      - DJANGO_SETTINGS_MODULE=objects.conf.docker
      - SECRET_KEY=${SECRET_KEY:-fgv=c0hz&tl*8*3m3893@m+1pstrvidc9e^5@fpspmg%cy$15d}
      - ALLOWED_HOSTS=*
      - DB_HOST=objects-db
      - DB_NAME=objects
      - DB_USER=objects
      - CACHE_DEFAULT=objects-redis:6379/0
      - CACHE_AXES=objects-redis:6379/0
      - DISABLE_2FA=true
      - CELERY_BROKER_URL=redis://objects-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://objects-redis:6379/0
      - NOTIFICATIONS_DISABLED=True
      - OBJECTS_SUPERUSER_USERNAME=admin
      - OBJECTS_SUPERUSER_PASSWORD=admin
      - OBJECTS_SUPERUSER_EMAIL=admin@localhost
      # Same OTel setup as the main app (docker-compose.yml's x-app-env) --
      # objects-api is built on the same `open_api_framework`/
      # `maykin_common` base, so it exports to the same collector.
      # OTEL_SDK_DISABLED defaults to true; bin/stack.sh up flips it for the
      # whole stack.
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=objects
      # Not host-overridable via ${...:-} -- see docker-compose.yml's
      # x-app-env for why.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic b3RlbDpzdXBlcnNlY3JldA==
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
      - OTEL_RESOURCE_ATTRIBUTES=oip.target=docker-compose
    ports:
      - 8004:8000
    volumes:
      - ./docker/objects-apis/fixtures/objects_api_fixtures.json:/app/fixtures/objects_api_fixtures.json
    # Without this, `docker compose up --wait` (bin/stack.sh) would consider
    # the container "healthy" the instant it's merely running, before
    # migrations/collectstatic finish. objects-api's own docker-compose.yml
    # doesn't define one either, so this mirrors the equivalent open-zaak
    # healthcheck (same open_api_framework/maykin_common base image family).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests;
          exit(requests.head('http://localhost:8000/admin/').status_code not in
          [200, 302])",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      objects-db:
        condition: service_healthy
      objects-redis:
        condition: service_started
    networks:
      open-inwoner-dev:
        aliases:
          - objects.local
          - objects.internal

  objects-celery:
    image: maykinmedia/objects-api:${OBJECTS_VERSION:-2.4.0}
    environment: *objects_web_env
    command: /celery_worker.sh
    # No healthcheck: only objects-web's readiness gates bin/stack.sh up's
    # --wait -- we don't need to confirm the celery worker's own liveness
    # before proceeding.
    depends_on:
      objects-db:
        condition: service_healthy
      objects-redis:
        condition: service_started
    networks:
      open-inwoner-dev:

volumes:
  objects-apis-db:

networks:
  # Created once via `bin/ensure_dev_network.sh`, not by this (or any other)
  # compose file, so bringing up several stacks together never races over who
  # "owns" the network. See docs/installation/docker-compose.rst.
  open-inwoner-dev:
    external: true
