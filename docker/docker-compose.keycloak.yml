services:
  keycloak:
    image: keycloak/keycloak:24.0.1-0
    # Fixed, resolvable hostname. Keycloak's start-dev XA/datasource init resolves the
    # container's own hostname; with the random container id it fails with
    # UnknownHostException ("Failed to obtain JDBC connection"). A stable hostname is
    # added to the container's /etc/hosts by Docker, so resolution succeeds.
    hostname: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Belt-and-suspenders: skip the XA transaction path that resolves the hostname.
      - KC_TRANSACTION_XA_ENABLED=false
    command: start-dev --import-realm
    volumes:
      - ./keycloak/fixtures/realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - 8080:8080
    # No /health endpoint without KC_HEALTH_ENABLED, so fall back to a plain
    # TCP check -- good enough to know the HTTP listener (and thus the
    # imported realm) is actually up, e.g. before `bin/stack.sh up`'s
    # `--wait` lets web-init try to reach it for OIDC discovery.
    healthcheck:
      test: ['CMD-SHELL', "bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      open-inwoner-dev:
        aliases:
          - keycloak.open-inwoner.local
          - keycloak.internal

networks:
  # Must match the network name in the root docker-compose.yml so the `web`
  # container can reach Keycloak server-side (OIDC token/userinfo/jwks calls).
  # Created once via `bin/ensure_dev_network.sh`, not by this (or any other)
  # compose file, so bringing up several stacks together never races over who
  # "owns" the network. See docs/installation/docker-compose.rst.
  open-inwoner-dev:
    external: true
