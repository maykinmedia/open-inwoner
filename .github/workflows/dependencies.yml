name: Resolve dependencies

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '**'
    paths:
      - 'bin/*'
      - 'requirements/*'
  pull_request:
    paths:
      - 'bin/*'
      - 'requirements/*'
  workflow_dispatch:

permissions: {}

jobs:
  compile_dependencies:
    name: Run compile_dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
          - os: macos-latest
            brew_deps: postgresql

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: 'pyproject.toml'

      - name: Install OS-level deps
        if: matrix.brew_deps
        run: brew install ${{ matrix.brew_deps }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Make sure current directory can be detected a git repository
        run: git init

      - name: Run bin/compile_dependencies.sh
        run: ./bin/compile_dependencies.sh
