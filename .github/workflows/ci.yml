name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Must match the `web` service's `image:` in docker-compose.yml, so
  # `bin/stack.sh up --no-build` finds the image loaded below.
  IMAGE_NAME: maykinmedia/open-inwoner

permissions: {}

jobs:
  #
  # Unit and integration tests
  #
  tests:
    name: Run the Django test suite
    runs-on:
      ${{ matrix.test-type == 'main' && 'maykin-runner' || 'ubuntu-26.04' }}
    permissions:
      contents: read
    strategy:
      matrix:
        test-type: [main, elastic, migrations]

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --name postgres
      elasticsearch:
        image: elasticsearch:9.0.3
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
          xpack.security.enabled: true
          ELASTIC_PASSWORD: elastic
        ports:
          - 9200:9200
          - 9300:9300
      redis:
        image: redis:6
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages:
            'libxml2-dev libxmlsec1-dev gettext postgresql-client libgdal-dev
            gdal-bin'
          python-version: '3.13'
          optimize-postgres: 'yes'
          pg-service: 'postgres'
          setup-node: 'yes'
          npm-ci-flags: '--legacy-peer-deps'

      - name: Run tests
        run: |
          if [ "${{ matrix.test-type }}" = "main" ]; then
            coverage run -p --concurrency=multiprocessing \
              src/manage.py test src \
              --parallel \
              --exclude-tag=e2e \
              --exclude-tag=elastic \
              --exclude-tag=migrations \
              -v 2
          elif [ "${{ matrix.test-type }}" = "elastic" ]; then
            coverage run -p src/manage.py test src \
              --tag=elastic \
              --exclude-tag=e2e \
              --exclude-tag=migrations \
              -v 2
          elif [ "${{ matrix.test-type }}" = "migrations" ]; then
            coverage run -p --concurrency=multiprocessing \
              src/manage.py test src --tag=migrations --parallel 2 -v 2
          else
            echo "Error: Unknown test type '${{ matrix.test-type }}'"
            exit 1
          fi
        env:
          DJANGO_SETTINGS_MODULE: open_inwoner.conf.ci
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_PASSWORD: ''
          ES_USERNAME: elastic
          ES_PASSWORD: elastic
          OTEL_SDK_DISABLED: true

      - name: Persist coverage data files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.test-type }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  upload_coverage:
    needs: tests
    name: Upload coverage information to codecov
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: 'pyproject.toml'
      - name: Install coverage.py
        # We only need coverage, but we need to match the version that was used
        # to generate the coverage files. Grab it from the dependencies.
        run: grep "^coverage" requirements/ci.txt | xargs -r pip install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverages
      - name: Combine the coverage files
        run: |
          mv coverages/main/.coverage* .
          mv coverages/elastic/.coverage* .
          mv coverages/migrations/.coverage* .
          coverage combine
      - name: Publish coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  #
  # End-to-end tests
  #
  e2etests:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
          - msedge

    name: End-to-end tests, ${{ matrix.browser }}

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --name postgres
      elasticsearch:
        image: elasticsearch:9.0.3
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
          xpack.security.enabled: true
          ELASTIC_PASSWORD: elastic
        ports:
          - 9200:9200
          - 9300:9300
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "/usr/local/bin/clamdcheck.sh" --health-interval 60s
          --health-timeout 30s --health-retries 5 --health-start-period 120s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages:
            'libxml2-dev libxmlsec1-dev gettext postgresql-client libgdal-dev
            gdal-bin'
          python-version: '3.13'
          optimize-postgres: 'yes'
          pg-service: 'postgres'
          setup-node: 'yes'
          npm-ci-flags: '--legacy-peer-deps'

      # Keycloak backs the `keycloak`-tagged OIDC login tests, which only run
      # under chromium: the authorization-code flow relies on cross-origin
      # cookies that Firefox/WebKit/Edge drop by default (see docs/testing.rst).
      # So we only boot Keycloak on the chromium leg and skip the tag elsewhere.
      - name: Start Keycloak (imports the test realm)
        if: matrix.browser == 'chromium'
        run: |
          bin/ensure_dev_network.sh
          docker compose -f docker/docker-compose.keycloak.yml --project-directory docker up -d
          echo "Waiting for Keycloak to import the test realm..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/realms/test/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak is ready"; exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready in time"
          docker compose -f docker/docker-compose.keycloak.yml --project-directory docker logs
          exit 1

      - name: Install playwright deps
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run testsuite
        run: |
          python src/manage.py collectstatic --noinput --link
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            src/manage.py test src --tag=e2e
          else
            src/manage.py test src --tag=e2e --exclude-tag=keycloak
          fi
        env:
          DJANGO_SETTINGS_MODULE: open_inwoner.conf.ci
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_PASSWORD: ''
          E2E_DRIVER: ${{ matrix.browser }}
          E2E_KEYCLOAK_REALM_URL: http://localhost:8080/realms/test
          ES_USERNAME: elastic
          ES_PASSWORD: elastic
          OTEL_SDK_DISABLED: true
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  #
  # Docker image builds
  #
  # Built with BuildKit up front, in parallel with the test suites, and exported
  # as an OCI archive. Outside PRs the archive holds both platforms; the stack
  # test runs on its amd64 image and the docker job pushes it unchanged. PRs
  # only build amd64 for the stack test, and check arm64 separately so the
  # slow emulated build doesn't hold up the stack test.
  docker-metadata:
    name: Determine Docker image tag
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Set tag
        id: vars
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${GITHUB_REF}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name (if present at all)
          [[ "${GITHUB_REF}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "main" ] && VERSION=latest

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: docker-metadata
    name: Build Docker image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.docker-metadata.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # linux/arm64 also covers Apple Silicon (macOS arm64) Docker hosts.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms:
            ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64'
            || 'linux/amd64' }}
          build-args: |
            RELEASE=${{ env.TAG }}
            COMMIT_HASH=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/open-inwoner.oci.tar
          cache-from: type=gha,scope=open-inwoner
          cache-to: type=gha,mode=max,scope=open-inwoner

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}/open-inwoner.oci.tar
          if-no-files-found: error
          retention-days: 1

  docker-build-arm64:
    needs: docker-metadata
    if: github.event_name == 'pull_request'
    name: Check Docker image builds (linux/arm64)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.docker-metadata.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            RELEASE=${{ env.TAG }}
            COMMIT_HASH=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=open-inwoner
            type=gha,scope=open-inwoner-arm64
          cache-to: type=gha,mode=max,scope=open-inwoner-arm64

  #
  # Full application stack
  #
  full-app-stack-test:
    needs: [docker-metadata, docker-build]
    name: Full Docker application stack
    runs-on: maykin-runner # Many containers, much resources
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image built by docker-build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Install skopeo
        run:
          command -v skopeo || (sudo apt-get update && sudo apt-get install -y
          skopeo)

      # Loads the amd64 image out of the (possibly multi-platform) archive.
      - name: Load the image
        env:
          TAG: ${{ needs.docker-metadata.outputs.tag }}
        run:
          skopeo copy --override-os linux --override-arch amd64
          "oci-archive:$RUNNER_TEMP/open-inwoner.oci.tar"
          "docker-daemon:$IMAGE_NAME:$TAG"

      # `--no-build` runs the stack on the image loaded above, i.e. exactly the
      # one the `docker` job pushes, instead of rebuilding it.
      - name: Bring up the full stack
        env:
          TAG: ${{ needs.docker-metadata.outputs.tag }}
          COMMIT_HASH: ${{ github.sha }}
        run: bin/stack.sh up --no-build

      - name: Wait for the app containers to come up healthy
        run: |
          # $2 = "healthy" to require a passing healthcheck, "running" to
          # just require the container hasn't crashed.
          wait_for() {
            local service="$1" want="$2" cid status
            for i in $(seq 1 60); do
              cid=$(bin/stack.sh ps -q "$service")
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
                echo "$service: $status"
                [ "$status" = "$want" ] && return 0
                case "$status" in exited | restarting)
                  echo "$service crashed (status: $status)" >&2
                  return 1
                  ;;
                esac
              fi
              sleep 5
            done
            echo "$service never reached '$want'" >&2
            return 1
          }

          # web, celery, celery-low-latency and celery-beat all have fast
          # healthchecks -- celery-beat's via the "Beat health sentinel"
          # periodic task (conf/base.py), which keeps its liveness file
          # fresh every minute. Wait for a real "healthy" on all four.
          wait_for web healthy
          wait_for celery healthy
          wait_for celery-low-latency healthy
          wait_for celery-beat healthy

          # celery-monitor has no healthcheck at all, so it can only ever
          # report "running" (docker inspect never returns a Health.Status
          # for it) -- just needs to still be running, not crashed.
          wait_for celery-monitor running

      - name: Dump service status and logs on failure
        if: failure()
        run: |
          bin/stack.sh ps
          bin/stack.sh logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: bin/stack.sh down -v

  #
  # Docs
  #
  docs:
    name: Build and check documentation
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages:
            'libxml2-dev libxmlsec1-dev gettext libgdal-dev gdal-bin graphviz'
          python-version: '3.13'
          setup-node: 'no'

      - name: Build docs
        run: |
          export OPENSSL_CONF=$(pwd)/openssl.conf
          pytest check_sphinx.py::test_build_docs -v --tb=auto
        working-directory: docs
        env:
          DJANGO_SETTINGS_MODULE: open_inwoner.conf.ci

  # External links break independently of our changes, so only check them on
  # the default branch to keep PRs from going red on unrelated link rot.
  docs-linkcheck:
    name: Check documentation links
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages:
            'libxml2-dev libxmlsec1-dev gettext libgdal-dev gdal-bin graphviz'
          python-version: '3.13'
          setup-node: 'no'

      - name: Check links
        run: |
          export OPENSSL_CONF=$(pwd)/openssl.conf
          pytest check_sphinx.py::test_linkcheck -v --tb=auto
        working-directory: docs
        env:
          DJANGO_SETTINGS_MODULE: open_inwoner.conf.ci

  #
  # Docker
  #
  docker:
    needs: [tests, docker-metadata, docker-build, full-app-stack-test]
    if: github.event_name == 'push'

    name: Push Docker image
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    env:
      TAG: ${{ needs.docker-metadata.outputs.tag }}

    # Pushes the archive built by docker-build unchanged; nothing is rebuilt.
    steps:
      - name: Download the image built by docker-build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Install skopeo
        run:
          command -v skopeo || (sudo apt-get update && sudo apt-get install -y
          skopeo)

      - name: Log into registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run:
          echo "$DOCKER_TOKEN" | skopeo login docker.io --username
          "$DOCKER_USERNAME" --password-stdin

      # `--preserve-digests` fails rather than altering any image on the way.
      - name: Push the Docker image
        run:
          skopeo copy --all --preserve-digests
          "oci-archive:$RUNNER_TEMP/open-inwoner.oci.tar"
          "docker://docker.io/$IMAGE_NAME:$TAG"
