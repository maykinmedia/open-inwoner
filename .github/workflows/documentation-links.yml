name: readthedocs/actions
on:
  # zizmor: ignore[dangerous-triggers]
  # Safe because this workflow has NO checkout step — the PR's code is never
  # fetched or run. pull_request_target is required so the action can post a
  # comment on fork PRs (pull_request lacks write permissions for forks).
  # WARNING: never add actions/checkout here; that would expose secrets to PR authors.
  pull_request_target:
    types:
      - opened
    # Execute this action only on PRs that touch
    # documentation files.
    paths:
      - 'docs/**'

permissions:
  pull-requests: write

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@b8bba1484329bda1a3abe986df7ebc80a8950333 # v1
        with:
          project-slug: 'open-inwoner'
