server {
    listen       80;
    server_name  localhost;

    location /private-media {
        internal;
        alias /private-media;
    }

    location /static {
        expires max;
        alias /srv/static;
    }

    # Scraped by the OTel collector's nginxreceiver (see
    # docker/observability/otel/otel-collector-config.yml) -- not access
    # restricted since this whole compose setup is local-dev only; restrict
    # this (e.g. to the docker network) before using this config anywhere
    # that isn't.
    location /_status {
        stub_status;
    }

    location / {
        client_max_body_size 100M;
        proxy_pass   http://web:8000;
        # Without these, nginx sends the upstream target (`web:8000`) as the
        # Host header instead of the client's original one, so anything Django
        # builds from request.build_absolute_uri() (OIDC redirect_uri, password
        # reset links, ...) ends up pointing at the internal Docker hostname.
        # $http_host (not $host!) is required here: nginx's $host deliberately
        # strips the port from the Host header, which silently drops :9000 from
        # every absolute URL Django builds.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
